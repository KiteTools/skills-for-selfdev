<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc"><title id="title">From one episode to your own rhythm</title><desc id="desc">Skills for Selfdev · connect only what you need</desc><rect width="1440" height="870" rx="24" fill="#F5F1E9"/><g font-family="Arial, sans-serif" fill="#26252D"><text x="64" y="72" font-size="18" letter-spacing="3" fill="#6957D5">SKILLS FOR SELFDEV</text><text x="64" y="137" font-size="43" font-weight="700">From one episode to your own rhythm</text><text x="64" y="182" font-size="23" fill="#68636F">Skills for Selfdev · connect only what you need</text><rect x="64" y="238" width="306" height="299" rx="16" fill="#E6EDE4"/><text x="88" y="280" font-size="19" fill="#6957D5">01</text><text x="88" y="325" font-size="28" font-weight="700">Material</text><text x="88" y="365" font-size="20">Note · transcript</text><text x="88" y="395" font-size="20">Event · question</text><path d="M88 424 H346" stroke="#BDB7C1"/><text x="88" y="464" font-size="19" fill="#68636F">Transcript Cleanup</text><text x="88" y="493" font-size="19" fill="#68636F">Life Events / SOOV</text><text x="373" y="365" font-size="25" fill="#6957D5">→</text><rect x="398" y="238" width="306" height="299" rx="16" fill="#EBE6F5"/><text x="422" y="280" font-size="19" fill="#6957D5">02</text><text x="422" y="325" font-size="28" font-weight="700">Understanding</text><text x="422" y="365" font-size="20">What happened?</text><text x="422" y="395" font-size="20">What remains a hypothesis?</text><path d="M422 424 H680" stroke="#BDB7C1"/><text x="422" y="464" font-size="19" fill="#68636F">Notes · session reflection</text><text x="422" y="493" font-size="19" fill="#68636F">GoR · Disco</text><text x="707" y="365" font-size="25" fill="#6957D5">→</text><rect x="732" y="238" width="306" height="299" rx="16" fill="#EEE6D8"/><text x="756" y="280" font-size="19" fill="#6957D5">03</text><text x="756" y="325" font-size="28" font-weight="700">Choice</text><text x="756" y="365" font-size="20">What do I accept?</text><text x="756" y="395" font-size="20">What do I want to try?</text><path d="M756 424 H1014" stroke="#BDB7C1"/><text x="756" y="464" font-size="19" fill="#68636F">Personal context</text><text x="756" y="493" font-size="19" fill="#68636F">Evening Ten</text><text x="1041" y="365" font-size="25" fill="#6957D5">→</text><rect x="1066" y="238" width="306" height="299" rx="16" fill="#E4EAEF"/><text x="1090" y="280" font-size="19" fill="#6957D5">04</text><text x="1090" y="325" font-size="28" font-weight="700">Review</text><text x="1090" y="365" font-size="20">What happened next?</text><text x="1090" y="395" font-size="20">What needs reconsidering?</text><path d="M1090 424 H1348" stroke="#BDB7C1"/><text x="1090" y="464" font-size="19" fill="#68636F">Journal</text><text x="1090" y="493" font-size="19" fill="#68636F">Weekly Review</text><rect x="64" y="590" width="1308" height="69" rx="12" fill="#6957D5"/><text x="91" y="634" font-size="26" fill="white">Codex Assistant: your context, focus and working agreements</text><rect x="64" y="679" width="1308" height="69" rx="12" fill="none" stroke="#A59FAF" stroke-dasharray="8 5"/><text x="91" y="723" font-size="24">Daily Assistant: journal and schedule · connected separately</text><text x="64" y="814" font-size="21" fill="#68636F">A suggestion is optional. Interest is not completion. One episode is not lasting change.</text></g></svg>