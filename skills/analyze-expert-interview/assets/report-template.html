<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
:root { color-scheme: light; --paper: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a8985; --line: #e6e5e1; --tile: #f3f2ee; --blue: #2a78d6; --callout: #f1f1ed; }
* { box-sizing: border-box; }
html { background: var(--paper); overflow-x: clip; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.55; }
.wrap { width: min(1040px, calc(100% - 48px)); margin: 0 auto; padding: 56px 0 104px; }
header { padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.kicker { margin: 0 0 12px; color: var(--ink2); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
h1 { max-width: 860px; margin: 0; font-size: 40px; line-height: 1.08; letter-spacing: -.035em; }
.lede { max-width: 760px; margin: 20px 0 0; color: var(--ink2); font-size: 19px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 26px 0 0; color: var(--ink3); font-size: 14px; }
.meta a, .tc { color: var(--blue); text-decoration-color: color-mix(in srgb, var(--blue), transparent 55%); text-underline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 32px; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.tile, .score { min-height: 112px; padding: 17px 18px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; }
.tile-label, .score-label { color: var(--ink3); font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
.tile-value { display: block; margin-top: 8px; font-size: 27px; font-weight: 680; line-height: 1; letter-spacing: -.03em; }
.score { min-height: 136px; background: #f7f7f4; }
.score-value { display: flex; align-items: baseline; gap: 5px; margin: 7px 0 9px; font-size: 34px; font-weight: 720; line-height: 1; letter-spacing: -.04em; }
.score-value small { color: var(--ink3); font-size: 14px; font-weight: 500; letter-spacing: 0; }
.meter { height: 7px; overflow: hidden; background: var(--line); border-radius: 999px; }
.meter > span { display: block; height: 100%; background: var(--blue); border-radius: inherit; }
.polarity { margin: 8px 0 0; color: var(--ink3); font-size: 12px; }
section { margin-top: 68px; }
h2 { margin: 0 0 18px; font-size: 25px; line-height: 1.15; letter-spacing: -.025em; }
h3 { margin: 32px 0 12px; font-size: 16px; }
.diagnosis-title { margin: 0 0 12px; font-size: 19px; line-height: 1.3; }
p { margin: 0 0 14px; }
.diagnosis-points { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 42px; row-gap: 20px; margin: 22px 0 26px; }
.diagnosis-point { padding-top: 11px; border-top: 1px solid var(--line); }
.diagnosis-label { margin: 0 0 5px; color: var(--ink3); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.diagnosis-copy { margin: 0; }
.callout { margin: 24px 0; padding: 17px 20px; border-left: 3px solid var(--ink3); background: var(--callout); color: var(--ink2); }
.quote { margin: 0 0 8px; font-size: 17px; }
.tc { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; white-space: nowrap; }
.trajectory { max-height: 560px; overflow-y: auto; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: #fdfdfb; }
.trajectory-key { display: flex; flex-wrap: wrap; gap: 7px 16px; margin: 0 0 8px; color: var(--ink2); font-size: 12px; }
.trajectory-key span { display: inline-flex; align-items: center; gap: 6px; }
.trajectory-key i { display: inline-block; flex: 0 0 auto; width: 10px; height: 10px; }
.topic-key { border-radius: 2px; background: linear-gradient(90deg, var(--blue) 0 50%, #7d9ccb 50%); }
.event-key { border-radius: 999px; background: var(--blue); }
.trajectory-cue { display: none; }
.trajectory-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.trajectory-scroll svg { display: block; width: 100%; min-width: 760px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 7px 15px; margin: 13px 0 0; color: var(--ink3); font-size: 12px; }
.legend span { min-width: 0; overflow-wrap: anywhere; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 2px; }
.event-summary { display: flex; flex-wrap: wrap; gap: 7px 16px; margin: 0 0 14px; padding: 0; color: var(--ink3); font-size: 13px; list-style: none; }
.event-summary-item { display: inline-flex; align-items: baseline; gap: 5px; }
.event-summary-item strong { color: var(--ink); font-size: 15px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14.5px; }
th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--ink3); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
td:first-child { font-weight: 620; }
.evidence { margin: 0; padding: 0; list-style: none; }
.evidence li { padding: 17px 0; border-bottom: 1px solid var(--line); }
.evidence blockquote { margin: 0 0 7px; font-size: 17px; }
.recommendations { padding: 0; margin: 0; list-style: none; counter-reset: fixes; }
.recommendations li { position: relative; padding: 0 0 22px 42px; counter-increment: fixes; }
.recommendations li::before { position: absolute; left: 0; top: 0; color: var(--blue); content: counter(fixes, decimal-leading-zero); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.recommendations strong { display: block; margin-bottom: 4px; }
.recommendation-body { margin: 0; }
.recommendation-basis { margin-top: 10px; padding: 10px 12px; border-left: 2px solid var(--ink3); background: #f7f7f4; color: var(--ink2); font-size: 14px; }
.basis-label { margin: 0 0 4px; color: var(--ink3); font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
.recommendation-basis blockquote { margin: 0 0 5px; font-size: 14px; line-height: 1.45; }
.basis-analysis { margin: 6px 0 0; }
details { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; }
summary { cursor: pointer; font-weight: 650; }
details > *:last-child { margin-bottom: 0; }
@media (max-width: 760px) {
  .wrap { width: min(100% - 28px, 1040px); padding-top: 34px; }
  header { padding-bottom: 24px; }
  h1 { font-size: 30px; }
  .lede { font-size: 17px; }
  section { margin-top: 48px; }
  .tiles, .scores { grid-template-columns: 1fr 1fr; }
  .tiles { margin-top: 28px; }
  .scores { margin-top: 12px; }
  .tile, .score { min-height: 98px; padding: 14px; }
  .diagnosis-points { grid-template-columns: 1fr; row-gap: 16px; }
  .trajectory { margin-left: -2px; margin-right: -2px; padding: 10px; }
  .trajectory-cue { display: block; margin: 0 0 8px; color: var(--ink3); font-size: 12px; }
  .trajectory-scroll { overflow-x: auto; }
  .trajectory-scroll svg { display: block; width: 760px; min-width: 760px; max-width: none; height: auto; }
  .legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; }
  .logic-scroll { overflow-x: visible; }
  .logic-table { min-width: 0; }
  .logic-table thead { display: none; }
  .logic-table, .logic-table tbody, .logic-table tr { display: block; width: 100%; }
  .logic-table tr { margin: 0 0 12px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fdfdfb; }
  .logic-table td { display: block; width: 100%; padding: 8px 0; border: 0; }
  .logic-table td::before { display: block; margin-bottom: 4px; content: attr(data-label); color: var(--ink3); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
}
</style>
</head>
<body>
<main class="wrap">
__BODY__
</main>
</body>
</html>
